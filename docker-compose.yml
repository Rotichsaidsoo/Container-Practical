services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: contact_db
      DB_USER: root
      DB_PASSWORD: secret_pass
    depends_on:
      - db
      - mail

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret_pass
      MYSQL_DATABASE: contact_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  mail:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  db_data: